<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Ocorrências Em Tempo Real</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; display: flex; flex-direction: column; }
        header { background: #1e293b; color: white; padding: 15px 20px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        #map { flex: 1; width: 100%; }
        .popup-content h4 { margin-bottom: 5px; color: #0f172a; }
        .popup-content p { font-size: 13px; margin-bottom: 3px; color: #475569; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: bold; margin-top: 5px; }
        .badge-nova { background: #fef3c7; color: #d97706; }
        .badge-atendimento { background: #dbeafe; color: #2563eb; }
        .badge-socorro { background: #ffedd5; color: #ea580c; }
    </style>
</head>
<body>

    <header>
        <h3>Mapa Operacional de Chamados</h3>
        <input type="text" id="buscaMapa" placeholder="🔍 Buscar motorista ou placa no mapa..." style="padding: 8px 12px; border-radius: 6px; border: none; width: 280px;">
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { escutarOcorrencias } from "./firebase.js";

        // Inicializa o mapa centralizado em SP por padrão
        const map = L.map('map').setView([-23.55052, -46.633308], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const markersGroup = L.layerGroup().addTo(map);
        let todasOcorrencias = [];
        let termoBusca = "";

        escutarOcorrencias(function(lista) {
            todasOcorrencias = lista;
            renderizarMarcadores();
        });

        document.getElementById("buscaMapa").addEventListener("input", (e) => {
            termoBusca = e.target.value.toLowerCase().trim();
            renderizarMarcadores();
        });

        function renderizarMarcadores() {
            markersGroup.clearLayers();

            const ocorrenciasFiltradas = todasOcorrencias.filter(o => {
                const ativas = o.status !== "encerrada" && o.latitude && o.longitude;
                const nome = (o.nome || "").toLowerCase();
                const placa = (o.placa || "").toLowerCase();
                const atendeFiltro = nome.includes(termoBusca) || placa.includes(termoBusca);
                
                return ativas && atendeFiltro;
            });

            if (ocorrenciasFiltradas.length > 0) {
                const bounds = [];
                ocorrenciasFiltradas.forEach(o => {
                    const lat = parseFloat(o.latitude);
                    const lng = parseFloat(o.longitude);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        bounds.push([lat, lng]);

                        const marker = L.marker([lat, lng]);
                        marker.bindPopup(`
                            <div class="popup-content">
                                <h4>${o.nome || 'Sem nome'}</h4>
                                <p><strong>Placa:</strong> ${o.placa || '-'}</p>
                                <p><strong>Rodovia:</strong> ${o.rodovia || '-'}</p>
                                <p><strong>Problema:</strong> ${o.problema || '-'}</p>
                                <span class="badge badge-${o.status}">${o.status.toUpperCase()}</span>
                            </div>
                        `);
                        markersGroup.addLayer(marker);
                    }
                });

                if (bounds.length > 0 && !termoBusca) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }
        }
    </script>
</body>
</html>
