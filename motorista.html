<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#d62828">

    <title>Socorro Rodoviário</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            background: #f1f3f5;

            color: #222;

            min-height: 100vh;

        }


        /* =========================
           CABEÇALHO
        ========================= */

        header {

            background: #d62828;

            color: white;

            padding: 22px 18px;

            text-align: center;

        }


        header .icone {

            font-size: 42px;

            margin-bottom: 8px;

        }


        header h1 {

            font-size: 23px;

            margin-bottom: 5px;

        }


        header p {

            font-size: 13px;

            opacity: .9;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 520px;

            margin: auto;

            padding: 18px;

        }


        /* =========================
           AVISO
        ========================= */

        .aviso {

            background: #fff3cd;

            border: 1px solid #ffe69c;

            color: #664d03;

            padding: 13px;

            border-radius: 9px;

            margin-bottom: 16px;

            font-size: 13px;

            line-height: 1.4;

        }


        /* =========================
           FORMULÁRIO
        ========================= */

        .card {

            background: white;

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,.08);

        }


        .titulo {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 18px;

        }


        .campo {

            margin-bottom: 15px;

        }


        label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input,
        select {

            width: 100%;

            height: 48px;

            border: 1px solid #d5d9de;

            border-radius: 8px;

            padding: 0 13px;

            font-size: 16px;

            background: white;

            outline: none;

        }


        input:focus,
        select:focus {

            border-color: #2878d7;

            box-shadow:
                0 0 0 2px
                rgba(40,120,215,.12);

        }


        /* =========================
           GPS
        ========================= */

        .gps {

            background: #eef7ff;

            border: 1px solid #cfe7ff;

            border-radius: 9px;

            padding: 13px;

            margin-bottom: 18px;

            font-size: 13px;

        }


        .gps-titulo {

            font-weight: bold;

            margin-bottom: 5px;

        }


        #gpsStatus {

            color: #666;

        }


        /* =========================
           BOTÃO
        ========================= */

        .btn-socorro {

            width: 100%;

            height: 62px;

            background: #d62828;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 0 #a91f1f;

            transition: .15s;

        }


        .btn-socorro:active {

            transform: translateY(3px);

            box-shadow:
                0 1px 0 #a91f1f;

        }


        .btn-socorro:disabled {

            background: #999;

            box-shadow: none;

            cursor: not-allowed;

        }


        /* =========================
           MENSAGEM
        ========================= */

        .mensagem {

            display: none;

            margin-top: 16px;

            padding: 16px;

            border-radius: 10px;

            text-align: center;

            font-weight: bold;

            line-height: 1.5;

        }


        .sucesso {

            display: block;

            background: #dff7e8;

            color: #176b38;

            border: 1px solid #b7ebc8;

        }


        .erro {

            display: block;

            background: #ffe3e5;

            color: #a61b1f;

            border: 1px solid #ffb8bd;

        }


        /* =========================
           RODAPÉ
        ========================= */

        footer {

            text-align: center;

            color: #777;

            font-size: 11px;

            padding: 20px;

        }


        @media(max-width: 400px) {

            .container {

                padding: 12px;

            }

            .card {

                padding: 16px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="icone">
        🆘
    </div>

    <h1>
        Socorro Rodoviário
    </h1>

    <p>
        Solicite ajuda quando estiver com problemas na rodovia
    </p>

</header>


<div class="container">


    <div class="aviso">

        ⚠️ <strong>Emergência?</strong><br>

        Se estiver em situação de perigo imediato,
        procure um local seguro e utilize os canais
        oficiais de emergência.

    </div>


    <div class="card">


        <div class="titulo">

            Dados do motorista

        </div>


        <!-- NOME -->

        <div class="campo">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                autocomplete="name">

        </div>


        <!-- PLACA -->

        <div class="campo">

            <label for="placa">
                Placa do veículo
            </label>

            <input
                type="text"
                id="placa"
                placeholder="ABC1D23"
                maxlength="7"
                style="text-transform:uppercase">

        </div>


        <!-- TELEFONE -->

        <div class="campo">

            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder="(00) 00000-0000"
                autocomplete="tel">

        </div>


        <!-- RODOVIA -->

        <div class="campo">

            <label for="rodovia">
                Rodovia
            </label>

            <input
                type="text"
                id="rodovia"
                placeholder="Ex.: BR-101">

        </div>


        <!-- SENTIDO -->

        <div class="campo">

            <label for="sentido">
                Sentido da viagem
            </label>

            <select id="sentido">

                <option value="">
                    Selecione
                </option>

                <option value="Norte">
                    Norte
                </option>

                <option value="Sul">
                    Sul
                </option>

                <option value="Leste">
                    Leste
                </option>

                <option value="Oeste">
                    Oeste
                </option>

                <option value="Não sei informar">
                    Não sei informar
                </option>

            </select>

        </div>


        <!-- PROBLEMA -->

        <div class="campo">

            <label for="problema">
                Qual é o problema?
            </label>

            <select id="problema">

                <option value="">
                    Selecione o problema
                </option>

                <option value="Pane mecânica">
                    🔧 Pane mecânica
                </option>

                <option value="Pneu furado">
                    🛞 Pneu furado
                </option>

                <option value="Falta de combustível">
                    ⛽ Falta de combustível
                </option>

                <option value="Bateria">
                    🔋 Bateria
                </option>

                <option value="Superaquecimento">
                    🌡️ Superaquecimento
                </option>

                <option value="Acidente">
                    🚨 Acidente
                </option>

                <option value="Outro">
                    ❓ Outro
                </option>

            </select>

        </div>


        <!-- GPS -->

        <div class="gps">

            <div class="gps-titulo">

                📍 Localização GPS

            </div>

            <div id="gpsStatus">

                Obtendo localização...

            </div>

        </div>


        <!-- BOTÃO -->

        <button
            id="btnEnviar"
            class="btn-socorro"
            disabled>

            🆘 PEDIR SOCORRO

        </button>


        <!-- MENSAGEM -->

        <div
            id="mensagem"
            class="mensagem">
        </div>


    </div>


</div>


<footer>

    Central de Socorro Rodoviário

</footer>
