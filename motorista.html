<script type="module">
import { criarOcorrencia } from "./firebase.js";

let latitude = null;
let longitude = null;

const gpsStatus = document.getElementById("gpsStatus");
const btnEnviar = document.getElementById("btnEnviar");
const mensagem = document.getElementById("mensagem");

function obterGPS() {
    if (!navigator.geolocation) {
        gpsStatus.innerText = "GPS não é suportado neste aparelho.";
        btnEnviar.disabled = false; // Permite enviar mesmo sem GPS
        return;
    }

    gpsStatus.innerText = "📡 Obtendo sua localização...";

    navigator.geolocation.getCurrentPosition(
        (posicao) => {
            latitude = posicao.coords.latitude;
            longitude = posicao.coords.longitude;
            gpsStatus.innerText = `✅ GPS obtido: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            btnEnviar.disabled = false;
        },
        (erro) => {
            console.warn("Erro ao obter GPS:", erro.message);
            gpsStatus.innerText = "⚠️ Não foi possível obter o GPS. Você ainda pode enviar.";
            btnEnviar.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

// Inicia a busca do GPS ao carregar
obterGPS();

// Clique no botão de enviar
btnEnviar.addEventListener("click", async () => {
    btnEnviar.disabled = true;
    btnEnviar.innerText = "Enviando...";
    mensagem.style.display = "none";

    const dados = {
        nome: document.getElementById("nome").value,
        placa: document.getElementById("placa").value,
        telefone: document.getElementById("telefone").value,
        rodovia: document.getElementById("rodovia").value,
        sentido: document.getElementById("sentido").value,
        problema: document.getElementById("problema").value,
        latitude: latitude,
        longitude: longitude
    };

    try {
        await criarOcorrencia(dados);
        mensagem.className = "mensagem sucesso";
        mensagem.innerText = "✅ Socorro solicitado com sucesso! Aguarde no local.";
        mensagem.style.display = "block";
    } catch (erro) {
        console.error(erro);
        mensagem.className = "mensagem erro";
        mensagem.innerText = "❌ Erro ao solicitar socorro. Tente novamente.";
        mensagem.style.display = "block";
        btnEnviar.disabled = false;
    } finally {
        btnEnviar.innerText = "🆘 PEDIR SOCORRO";
    }
});
</script>
