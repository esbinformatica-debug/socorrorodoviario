<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Operador - Sinal Amarelo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .stats-bar { display: flex; gap: 15px; background: white; padding: 15px 20px; border-bottom: 1px solid #e2e8f0; }
        .stat-card { flex: 1; padding: 10px 15px; border-radius: 8px; background: #f8fafc; border: 1px solid #cbd5e1; text-align: center; }
        .stat-card .num { font-size: 20px; font-weight: bold; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .panel { flex: 1; border-right: 1px solid #e2e8f0; background: white; display: flex; flex-direction: column; }
        .panel-title { padding: 15px; font-weight: bold; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
        #listaOcorrencias { flex: 1; overflow-y: auto; }
        .ocorrencia { padding: 15px; border-bottom: 1px solid #e2e8f0; cursor: pointer; transition: background 0.2s; }
        .ocorrencia:hover { background: #f1f5f9; }
        .ocorrencia.selecionada { background: #e2e8f0; border-left: 4px solid #0284c7; }
        .ocorrencia .id { font-weight: bold; display: flex; justify-content: space-between; }
        .ocorrencia .motorista { color: #0f172a; font-weight: 600; font-size: 15px; margin-top: 4px; }
        .ocorrencia .local { font-size: 13px; color: #64748b; margin-top: 2px; }
        .status { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        .status-nova { background: #fef3c7; color: #d97706; }
        .status-atendimento { background: #dbeafe; color: #2563eb; }
        .status-socorro { background: #ffedd5; color: #ea580c; }
        .status-encerrada { background: #f1f5f9; color: #64748b; }
        .details-panel { flex: 2; padding: 20px; background: white; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .detail-row { display: flex; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
        .detail-label { width: 150px; font-weight: bold; color: #64748b; }
        .detail-value { flex: 1; color: #0f172a; }
        .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-atender { background: #2563eb; color: white; }
        .btn-socorro { background: #ea580c; color: white; }
        .btn-encerrar { background: #16a34a; color: white; }
    </style>
</head>
<body>

    <header>
        <h2>Painel do Operador - Central de Atendimento</h2>
    </header>

    <div class="stats-bar">
        <div class="stat-card">Novas: <span class="num" id="totalNovas">0</span></div>
        <div class="stat-card">Em Atendimento: <span class="num" id="totalAtendimento">0</span></div>
        <div class="stat-card">Socorro A caminho: <span class="num" id="totalSocorro">0</span></div>
        <div class="stat-card">Total: <span class="num" id="totalOcorrencias">0</span></div>
    </div>

    <div class="main-container">
        <div class="panel">
            <div class="panel-title">Ocorrências</div>
            <div style="padding: 10px 16px; border-bottom: 1px solid #eee;">
                <input type="text" id="campoBusca" placeholder="🔍 Buscar por Nome ou Placa..." style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
            </div>
            <div id="listaOcorrencias"></div>
        </div>

        <div class="details-panel">
            <h3 id="titulo">Selecione uma ocorrência</h3>
            <div id="areaDetalhes" style="display: none;">
                <div class="detail-row">
                    <div class="detail-label">Data e Hora:</div>
                    <div class="detail-value" id="dataCriacao">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Motorista:</div>
                    <div class="detail-value" id="nome">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Placa:</div>
                    <div class="detail-value" id="placa">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Modelo:</div>
                    <div class="detail-value" id="modelo">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Nº Ocupantes:</div>
                    <div class="detail-value" id="n_ocupantes">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Telefone:</div>
                    <div class="detail-value" id="telefone">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Rodovia:</div>
                    <div class="detail-value" id="rodovia">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Sentido:</div>
                    <div class="detail-value" id="sentido">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Problema:</div>
                    <div class="detail-value" id="problema">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Coordenadas:</div>
                    <div class="detail-value">
                        Lat: <span id="latitude">-</span> | Long: <span id="longitude">-</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn-atender" id="btnAtender">Iniciar Atendimento</button>
                    <button class="btn-socorro" id="btnSocorro">Enviar Socorro</button>
                    <button class="btn-encerrar" id="btnEncerrar">Encerrar Ocorrência</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { escutarOcorrencias, alterarStatus } from "./firebase.js";

        let ocorrencias = [];
        let selecionada = null;
        let filtroBusca = "";

        escutarOcorrencias(function(lista) {
            ocorrencias = lista;
            atualizarPainel();
            if (selecionada) {
                const itemAtualizado = ocorrencias.find(o => o.id === selecionada);
                if (itemAtualizado) mostrarDetalhes(itemAtualizado);
            }
        });

        document.getElementById("campoBusca").addEventListener("input", (e) => {
            filtroBusca = e.target.value.toLowerCase().trim();
            atualizarPainel();
        });

        function formatarDataHora(timestamp) {
            if (!timestamp) return "Aguardando...";
            if (typeof timestamp.toDate === 'function') return timestamp.toDate().toLocaleString('pt-BR');
            const data = new Date(timestamp);
            return !isNaN(data.getTime()) ? data.toLocaleString('pt-BR') : "-";
        }

        function formatarHoraApenas(timestamp) {
            if (!timestamp) return "";
            const data = typeof timestamp.toDate === 'function' ? timestamp.toDate() : new Date(timestamp);
            return isNaN(data.getTime()) ? "" : data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function classeStatus(status) {
            switch(status) {
                case "nova": return "status-nova";
                case "atendimento": return "status-atendimento";
                case "socorro": return "status-socorro";
                default: return "status-encerrada";
            }
        }

        function textoStatus(status) {
            switch(status) {
                case "nova": return "Nova";
                case "atendimento": return "Em Atendimento";
                case "socorro": return "Socorro Enviado";
                default: return "Encerrada";
            }
        }

        function atualizarPainel() {
            const ocorrenciasFiltradas = ocorrencias.filter(o => {
                const nome = (o.nome || "").toLowerCase();
                const placa = (o.placa || "").toLowerCase();
                return nome.includes(filtroBusca) || placa.includes(filtroBusca);
            });

            document.getElementById("totalNovas").innerText = ocorrencias.filter(o => o.status === "nova").length;
            document.getElementById("totalAtendimento").innerText = ocorrencias.filter(o => o.status === "atendimento").length;
            document.getElementById("totalSocorro").innerText = ocorrencias.filter(o => o.status === "socorro").length;
            document.getElementById("totalOcorrencias").innerText = ocorrencias.length;

            const lista = document.getElementById("listaOcorrencias");
            lista.innerHTML = "";

            if (ocorrenciasFiltradas.length === 0) {
                lista.innerHTML = `<p style="padding:20px; color:#777;">Nenhuma ocorrência encontrada.</p>`;
                return;
            }

            ocorrenciasFiltradas.forEach(ocorrencia => {
                const div = document.createElement("div");
                div.className = `ocorrencia ${ocorrencia.id === selecionada ? 'selecionada' : ''}`;
                const hora = formatarHoraApenas(ocorrencia.criadoEm);

                div.innerHTML = `
                    <div class="id">
                        <span>#${ocorrencia.id.substring(0,8)}</span>
                        <span style="font-size:12px; color:#777; font-weight:normal;">🕒 ${hora}</span>
                    </div>
                    <div class="motorista">${ocorrencia.nome || "Sem nome"}</div>
                    <div style="font-size:13px;">🚗 ${ocorrencia.placa || "-"}</div>
                    <div class="local">📍 ${ocorrencia.rodovia || "Rodovia não informada"}</div>
                    <div class="status ${classeStatus(ocorrencia.status)}">
                        ${textoStatus(ocorrencia.status)}
                    </div>
                `;

                div.onclick = function() {
                    selecionada = ocorrencia.id;
                    mostrarDetalhes(ocorrencia);
                    atualizarPainel();
                };

                lista.appendChild(div);
            });
        }

        function mostrarDetalhes(o) {
            document.getElementById("titulo").innerText = "Ocorrência #" + o.id.substring(0,8);
            document.getElementById("areaDetalhes").style.display = "block";

            document.getElementById("dataCriacao").innerText = formatarDataHora(o.criadoEm);
            document.getElementById("nome").innerText = o.nome || "-";
            document.getElementById("placa").innerText = o.placa || "-";
            document.getElementById("modelo").innerText = o.modelo || "-";
            document.getElementById("n_ocupantes").innerText = o.ocupantes || o.n_ocupantes || o.n_ocupante || "-";
            document.getElementById("telefone").innerText = o.telefone || "-";
            document.getElementById("rodovia").innerText = o.rodovia || "-";
            document.getElementById("sentido").innerText = o.sentido || "-";
            document.getElementById("problema").innerText = o.problema || "-";
            document.getElementById("latitude").innerText = o.latitude ?? "-";
            document.getElementById("longitude").innerText = o.longitude ?? "-";
        }

        document.getElementById("btnAtender").onclick = () => selecionada && alterarStatus(selecionada, "atendimento");
        document.getElementById("btnSocorro").onclick = () => selecionada && alterarStatus(selecionada, "socorro");
        document.getElementById("btnEncerrar").onclick = () => selecionada && alterarStatus(selecionada, "encerrada");
    </script>
</body>
</html>
