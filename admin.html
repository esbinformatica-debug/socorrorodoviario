<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - DER-SP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        header { background: #14213d; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background: #e8f0fe; }
    </style>
</head>
<body>

<header>
    <h1>⚙️ Administração do Sistema de Socorro Rodoviário</h1>
</header>

<h2>Histórico Geral de Ocorrências</h2>
<br>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Data/Hora</th>
            <th>Motorista</th>
            <th>Placa</th>
            <th>Rodovia</th>
            <th>Problema</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="tabelaOcorrencias">
        <tr><td colspan="7">A carregar registos...</td></tr>
    </tbody>
</table>

<script type="module">
import { escutarOcorrencias } from "./firebase.js";

escutarOcorrencias((lista) => {
    const tbody = document.getElementById("tabelaOcorrencias");
    tbody.innerHTML = "";

    lista.forEach(o => {
        const tr = document.createElement("tr");
        const data = o.criadoEm && o.criadoEm.toDate ? o.criadoEm.toDate().toLocaleString('pt-BR') : "-";
        
        tr.innerHTML = `
            <td>#${o.id.substring(0,8)}</td>
            <td>${data}</td>
            <td>${o.nome || '-'}</td>
            <td>${o.placa || '-'}</td>
            <td>${o.rodovia || '-'}</td>
            <td>${o.problema || '-'}</td>
            <td><strong>${o.status}</strong></td>
        `;
        tbody.appendChild(tr);
    });
});
</script>
</body>
</html>
