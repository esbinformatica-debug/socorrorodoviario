<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operador de Guincho - Socorro Rodoviário</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --header-bg: #1e293b;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #f59e0b;
            --danger: #dc2626;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--header-bg);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8fafc;
            color: var(--text-dark);
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .radio-card {
            position: relative;
        }

        .radio-card input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .radio-card input:checked + .radio-label {
            background-color: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
        }

        .dynamic-section {
            display: none;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .alert {
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            font-weight: 500;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .time-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🚛 Operador de Guincho</h1>
        <p>Registro de Ocorrências & Atendimentos</p>
    </header>

    <div class="container">
        <form id="formOperador">
            
            <!-- IDENTIFICAÇÃO DO OPERADOR E VIATURA -->
            <div class="card">
                <div class="card-title">
                    <span>🆔 Dados do Operador & Viatura</span>
                </div>
                <div class="form-group">
                    <label for="nomeOperador">Nome do Operador:</label>
                    <input type="text" id="nomeOperador" placeholder="Ex: João Silva" required>
                </div>
                <div class="row-2">
                    <div class="form-group">
                        <label for="prefixoViatura">Prefixo Viatura:</label>
                        <input type="text" id="prefixoViatura" placeholder="Ex: G-04" required>
                    </div>
                    <div class="form-group">
                        <label for="hodometroInicial">Hodômetro Inicial (KM):</label>
                        <input type="number" id="hodometroInicial" step="0.1" placeholder="Ex: 120450" required>
                    </div>
                </div>
            </div>

            <!-- TIPO DE REGISTRO / OCORRÊNCIA -->
            <div class="card">
                <div class="card-title">
                    <span>⚠️ Tipo de Ocorrência</span>
                </div>
                <div class="form-group">
                    <label>Selecione a Categoria:</label>
                    <div class="radio-group">
                        <div class="radio-card">
                            <input type="radio" id="catAtendimento" name="categoriaOcorrencia" value="atendimento">
                            <label for="catAtendimento" class="radio-label">🚨 Acidente / Pane</label>
                        </div>
                        <div class="radio-card">
                            <input type="radio" id="catVia" name="categoriaOcorrencia" value="via">
                            <label for="catVia" class="radio-label">🛣️ Ocorrência na Via</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO: ACIDENTE / PANE -->
            <div id="secaoAtendimento" class="dynamic-section card">
                <div class="card-title">
                    <span>🚗 Detalhes do Atendimento</span>
                    <span class="time-badge" id="horarioDisplay">🕒 --:--:--</span>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <label for="kmExato">KM Exato:</label>
                        <input type="text" id="kmExato" placeholder="Ex: KM 142+500">
                    </div>
                    <div class="form-group">
                        <label for="sentido">Sentido:</label>
                        <select id="sentido">
                            <option value="">Selecione...</option>
                            <option value="Norte">Norte</option>
                            <option value="Sul">Sul</option>
                            <option value="Leste">Leste</option>
                            <option value="Oeste">Oeste</option>
                            <option value="Capital">Capital</option>
                            <option value="Interior">Interior</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="hodometroAtual">Hodômetro Atual Viatura (KM):</label>
                    <input type="number" id="hodometroAtual" step="0.1" placeholder="Ex: 120485">
                </div>

                <div class="form-group">
                    <label for="tipoPane">Tipo de Pane / Situação:</label>
                    <select id="tipoPane">
                        <option value="">Selecione o tipo...</option>
                        <option value="Elétrica">Elétrica</option>
                        <option value="Mecânica">Mecânica</option>
                        <option value="Seca">Seca (Falta de Combustível)</option>
                        <option value="Pneu Furado">Pneu Furado</option>
                        <option value="Acidentado">Acidentado</option>
                        <option value="Abandonado">Abandonado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="acaoTomada">Ações Tomadas pelo Operador:</label>
                    <select id="acaoTomada">
                        <option value="">Selecione a ação...</option>
                        <option value="Usuário seguiu viagem">Usuário seguiu viagem</option>
                        <option value="Usuário Removido">Usuário Removido</option>
                        <option value="Auxiliado no Local (Água/Ferramenta)">Auxiliado no Local (Água/Ferramenta)</option>
                        <option value="Aguarda seguro no local">Aguarda seguro no local</option>
                        <option value="Necessidade de remoção">Necessidade de remoção</option>
                    </select>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <label for="placaVeiculo">Placa (Opcional):</label>
                        <input type="text" id="placaVeiculo" placeholder="Ex: ABC-1234" style="text-transform: uppercase;">
                    </div>
                    <div class="form-group">
                        <label for="modeloVeiculo">Modelo (Opcional):</label>
                        <input type="text" id="modeloVeiculo" placeholder="Ex: Gol / Corolla">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO: OCORRÊNCIA NA VIA -->
            <div id="secaoVia" class="dynamic-section card">
                <div class="card-title">
                    <span>🛠️ Anomalias e Ocorrências na Via</span>
                </div>

                <div class="form-group">
                    <label for="tipoOcorrenciaVia">Tipo de Ocorrência na Via:</label>
                    <select id="tipoOcorrenciaVia">
                        <option value="">Selecione o problema na via...</option>
                        <option value="Placa danificada">Placa danificada</option>
                        <option value="Suporte danificado">Suporte danificado</option>
                        <option value="Buraco na via">Buraco na via</option>
                        <option value="Sinalização horizontal danificada">Sinalização horizontal danificada</option>
                        <option value="Obstáculo na via">Obstáculo na via</option>
                        <option value="Incêndio">Incêndio</option>
                        <option value="Animais na via">Animais na via</option>
                    </select>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <label for="kmExatoVia">KM Exato:</label>
                        <input type="text" id="kmExatoVia" placeholder="Ex: KM 88+200">
                    </div>
                    <div class="form-group">
                        <label for="sentidoVia">Sentido:</label>
                        <select id="sentidoVia">
                            <option value="">Selecione...</option>
                            <option value="Norte">Norte</option>
                            <option value="Sul">Sul</option>
                            <option value="Leste">Leste</option>
                            <option value="Oeste">Oeste</option>
                            <option value="Capital">Capital</option>
                            <option value="Interior">Interior</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="observacoesVia">Observações / Providências:</label>
                    <textarea id="observacoesVia" rows="3" placeholder="Sinalizado o local, informado o CCO, etc."></textarea>
                </div>
            </div>

            <!-- BOTÃO E MENSAGENS -->
            <button type="submit" id="btnEnviar" class="btn-submit">REGISTRAR OCORRÊNCIA</button>
            <div id="mensagemAlerta" class="alert"></div>
        </form>
    </div>

    <!-- LOGICA E CONEXÃO COM FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        // Configurações do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDCqAkO1L5935U1E2a2PW5HkpZJy0Gauwc",
            authDomain: "derchamados.firebaseapp.com",
            projectId: "derchamados",
            storageBucket: "derchamados.firebasestorage.app",
            messagingSenderId: "922256232360",
            appId: "1:922256232360:web:a0492c02fcbbf6a7dd579d",
            measurementId: "G-0BNGCJ6NSH"
        };

        // Inicialização
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Elementos do DOM
        const form = document.getElementById('formOperador');
        const radiosCategoria = document.querySelectorAll('input[name="categoriaOcorrencia"]');
        const secaoAtendimento = document.getElementById('secaoAtendimento');
        const secaoVia = document.getElementById('secaoVia');
        const horarioDisplay = document.getElementById('horarioDisplay');
        const alerta = document.getElementById('mensagemAlerta');
        const btnEnviar = document.getElementById('btnEnviar');

        // Atualizador do Horário Automático
        function atualizarHorario() {
            const agora = new Date();
            const horaFormatada = agora.toLocaleTimeString('pt-BR');
            horarioDisplay.innerText = `🕒 ${horaFormatada}`;
        }
        setInterval(atualizarHorario, 1000);
        atualizarHorario();

        // Controle de Exibição Dinâmica das Seções
        radiosCategoria.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const val = e.target.value;
                if (val === 'atendimento') {
                    secaoAtendimento.style.display = 'block';
                    secaoVia.style.display = 'none';
                } else if (val === 'via') {
                    secaoAtendimento.style.display = 'none';
                    secaoVia.style.display = 'block';
                }
            });
        });

        // Envio do Formulário para o Firestore
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const categoria = document.querySelector('input[name="categoriaOcorrencia"]:checked')?.value;
            if (!categoria) {
                mostrarAlerta('Por favor, selecione o tipo de ocorrência.', 'error');
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.innerText = 'Gravando registro...';
            alerta.style.display = 'none';

            // Dados Gerais
            const dadosOperador = {
                tipoRegistro: 'operador_guincho',
                categoria: categoria,
                nomeOperador: document.getElementById('nomeOperador').value,
                prefixoViatura: document.getElementById('prefixoViatura').value,
                hodometroInicial: parseFloat(document.getElementById('hodometroInicial').value) || 0,
                horarioRegistro: new Date().toLocaleTimeString('pt-BR'),
                criadoEm: serverTimestamp()
            };

            // Dados Específicos por Categoria
            let dadosCompletos = { ...dadosOperador };

            if (categoria === 'atendimento') {
                dadosCompletos = {
                    ...dadosCompletos,
                    kmExato: document.getElementById('kmExato').value,
                    sentido: document.getElementById('sentido').value,
                    hodometroAtual: parseFloat(document.getElementById('hodometroAtual').value) || null,
                    tipoPane: document.getElementById('tipoPane').value,
                    acaoTomada: document.getElementById('acaoTomada').value,
                    placaVeiculo: document.getElementById('placaVeiculo').value,
                    modeloVeiculo: document.getElementById('modeloVeiculo').value,
                    // Campos para compatibilidade com painéis existentes
                    problema: `Pane: ${document.getElementById('tipoPane').value} - Ação: ${document.getElementById('acaoTomada').value}`,
                    status: 'atendimento'
                };
            } else if (categoria === 'via') {
                dadosCompletos = {
                    ...dadosCompletos,
                    tipoOcorrenciaVia: document.getElementById('tipoOcorrenciaVia').value,
                    kmExato: document.getElementById('kmExatoVia').value,
                    sentido: document.getElementById('sentidoVia').value,
                    observacoes: document.getElementById('observacoesVia').value,
                    // Campos de compatibilidade
                    problema: `Via: ${document.getElementById('tipoOcorrenciaVia').value}`,
                    status: 'atendimento'
                };
            }

            try {
                await addDoc(collection(db, "ocorrencias"), dadosCompletos);
                mostrarAlerta('✅ Ocorrência registrada com sucesso!', 'success');
                
                // Mantém os dados da viatura/operador para agilizar os próximos registros
                const operadorSalvo = document.getElementById('nomeOperador').value;
                const viaturaSalva = document.getElementById('prefixoViatura').value;
                const hodometroSalvo = document.getElementById('hodometroAtual').value || document.getElementById('hodometroInicial').value;

                form.reset();

                // Restaura os dados fixos do operador
                document.getElementById('nomeOperador').value = operadorSalvo;
                document.getElementById('prefixoViatura').value = viaturaSalva;
                document.getElementById('hodometroInicial').value = hodometroSalvo;

                secaoAtendimento.style.display = 'none';
                secaoVia.style.display = 'none';

            } catch (erro) {
                console.error("Erro ao registrar:", erro);
                mostrarAlerta('❌ Erro ao registrar ocorrência. Tente novamente.', 'error');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerText = 'REGISTRAR OCORRÊNCIA';
            }
        });

        function mostrarAlerta(msg, tipo) {
            alerta.innerText = msg;
            alerta.className = `alert alert-${tipo}`;
            alerta.style.display = 'block';
        }
    </script>
</body>
</html>
